<style>
:root{--bg:#f4f7fe;--card:#fff;--ink:#14213d;--mut:#5b6b8a;--acc:#2f5bea;--acc2:#e8eeff;--ok:#1f9d63;--ok2:#e3f6ec;--bad:#d64545;--line:#dde5f5;--warm:#f59e0b;--warm2:#fff3d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:16px}

.sub,.hint{color:var(--mut);font-size:.88rem;margin:0 0 14px}
button,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}

.primary,.tabs button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.danger{color:var(--bad)}

.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}

function gq(idx){const g=GR[idx],all=GR.flatMap(x=>x.e),L=shuffle(g.e);let n=0,s=0;
const step=()=>{if(n>=L.length){app.innerHTML=`<button id="bk">بازگشت به درس</button><div class="card" style="margin-top:12px"><div class="hint">نتیجه تمرین: ${esc(g.t)}</div><div class="res">${s} از ${L.length}</div></div><button id="rs" class="primary" style="width:100%;margin-top:12px">دوباره</button>`;app.querySelector("#bk").onclick=()=>lesson("gr"+idx);app.querySelector("#rs").onclick=()=>gq(idx);return}
const w=L[n],o=shuffle([w,...shuffle(all.filter(x=>x[0]!==w[0])).slice(0,3)]);
app.innerHTML=`<button id="bk">بازگشت به درس</button><div class="bar" style="margin-top:12px"><i style="width:${n/L.length*100}%"></i></div><div class="card"><div class="hint">انگلیسی این جمله کدام است؟</div><div class="fa">${esc(w[1])}</div></div><div class="opts">${o.map(x=>`<button dir="ltr">${esc(x[0])}</button>`).join("")}</div><div class="row"><span class="hint">${n+1} از ${L.length}</span><button id="nq" class="primary" hidden>ادامه</button></div>`;
app.querySelector("#bk").onclick=()=>lesson("gr"+idx);
let lock=false;const bs=[...app.querySelectorAll(".opts button")];
bs.forEach((b,k)=>b.onclick=()=>{if(lock)return;lock=true;const r=o[k]===w;if(r){s++;addXP(10)}b.classList.add(r?"ok":"bad");if(!r)bs.forEach((x,j)=>{if(o[j]===w)x.classList.add("ok")});const q=app.querySelector("#nq");q.hidden=false;q.focus()});
app.querySelector("#nq").onclick=()=>{n++;step()}};step()}
function backup(){app.innerHTML=`<button id="bk">بازگشت</button><h2>پشتیبان‌گیری و انتقال</h2><p class="hint">این متن را کپی کن و در دستگاه دیگر در کادر «وارد کردن» بچسبان.</p><textarea id="o1" readonly>${esc(JSON.stringify(units))}</textarea><button id="cp" class="primary">کپی</button><h2>وارد کردن</h2><textarea id="im" placeholder="متن پشتیبان را اینجا بچسبان"></textarea><button id="ip">جایگزین کردن اطلاعات این دستگاه</button><p class="hint" id="m"></p>`;
const m=app.querySelector("#m");app.querySelector("#bk").onclick=home;

DL.push({t:"در فرودگاه",l:[["Clerk","Good morning. Passport and ticket, please.","صبح بخیر. گذرنامه و بلیت لطفاً."],["Sara","Here you are.","بفرمایید."],["Clerk","Are you checking any bags?","چمدانی برای تحویل دارید؟"],["Sara","Yes, just this suitcase.","بله، فقط همین چمدان."],["Clerk","Your flight leaves from gate twelve.","پروازتان از گیت دوازده حرکت می‌کند."],["Sara","Thank you. Is the flight on time?","ممنونم. پرواز سر وقت است؟"],["Clerk","Yes. Boarding starts at ten thirty.","بله. سوار شدن ساعت ده و نیم شروع می‌شود."]]},
{t:"تماس تلفنی",l:[["Dan","Hello? Is this Emma?","الو؟ شما اِما هستید؟"],["Emma","Speaking. Who's calling?","خودم هستم. شما؟"],["Dan","It's Dan from work. Do you have a minute?","من دن هستم از محل کار. یک لحظه وقت دارید؟"],["Emma","Sure. What's up?","حتماً. چه شده؟"],["Dan","The meeting has moved to three o'clock.","جلسه به ساعت سه منتقل شده."],["Emma","Okay, thanks for letting me know.","باشه، ممنون که خبر دادی."],["Dan","No problem. See you later!","خواهش می‌کنم. بعداً می‌بینمت!"]]},
{t:"در داروخانه",l:[["Pharmacist","How can I help you?","چه کمکی از من برمی‌آید؟"],["Leo","I have a headache and a sore throat.","سردرد و گلودرد دارم."],["Pharmacist","How long have you had them?","از کی دارید؟"],["Leo","Since yesterday morning.","از دیروز صبح."],["Pharmacist","Take one of these tablets twice a day.","از این قرص‌ها روزی دو بار یکی بخورید."],["Leo","Do I need to take it with food?","باید با غذا بخورم؟"],["Pharmacist","Yes, and drink plenty of water.","بله و آب زیاد بنوشید."]]});
const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
function score(t,alts){const tw=norm(t).split(" "),best={p:-1,mark:[],said:""};
for(const a of alts){const aw=norm(a).split(" "),used=new Set(),mark=tw.map(w=>{const k=aw.findIndex((x,i)=>!used.has(i)&&(x===w||(w.length>=5&&lev(x,w)<=1)));if(k>=0){used.add(k);return 1}return 0}),p=mark.reduce((s,x)=>s+x,0)/tw.length;if(p>best.p){best.p=p;best.mark=mark;best.said=a}}
return{tw,...best}}
function showCmp(box,t,alts){const r=score(t,alts),p=Math.round(Math.max(r.p,0)*100);if(p>=90)addXP(10);

function addXP(n){const d=today();PROF.dxp=PROF.dxp||{};const b=PROF.dxp[d]||0,g=PROF.goal||50;PROF.dxp[d]=b+n;PROF.xp=(PROF.xp||0)+n;markDay();

function streakCard(){const d=today(),dx=PROF.dxp||{},g=PROF.goal||50,t=dx[d]||0,pc=Math.min(1,t/g),xp=PROF.xp||0,s=streak(),wk=[];
for(let k=6;k>=0;k--){const dt=new Date();dt.setDate(dt.getDate()-k);const key=dt.toISOString().slice(0,10),x=dx[key]||(PROF.days.includes(key)?1:0);wk.push(`<div class="${x?"on":""}"><i>${x>=g?"🔥":x?"✅":"⚪"}</i>${dt.toLocaleDateString("fa-IR",{weekday:"short"})}</div>`)}
return `<div class="sk"><div class="sk1"><span class="fl">🔥</span><div><b>${s}</b><span class="hint" style="margin:0">روز پشت‌سرهم</span></div></div><div class="ring"><svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(pc*163.4).toFixed(1)} 163.4"/></svg><span>${t}/${g}</span></div><div class="wk">${wk.join("")}</div><div class="row" style="grid-column:1/-1;margin:0"><span class="hint" style="margin:0">سطح ${Math.floor(xp/200)+1} · ${xp} XP${t===0&&s>0?" · امروز تمرین کن تا رشته‌ات نپره!":""}</span><button id="gl">هدف روزانه: ${g}</button></div></div>`}
